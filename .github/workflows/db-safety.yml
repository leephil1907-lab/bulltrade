name: Database Safety

on:
  push:
    branches: [main, fix/db-corruption-safe]
  pull_request:
    branches: [main]

jobs:
  db-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run database corruption regression test
        run: node tests/db-safety.js
