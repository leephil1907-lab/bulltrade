name: Bulltrade Safety Checks

on:
  push:
    branches: [main, fix/db-corruption-safe]
  pull_request:
    branches: [main]

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run database corruption regression test
        run: npm run test:db-safety
      - name: Ensure simulated trading cannot be mistaken for live execution
        run: npm run test:live-guard
