# ============================================================================
# Trigger a Render deploy on every push to main.
#
# WHY THIS EXISTS
#   This repository has no GitHub webhook and no Render GitHub App hook, so a
#   push alone does not start a deploy — Render keeps serving whatever build it
#   was last told to deploy. This workflow closes that gap once you paste a
#   Render *deploy hook* URL into the repository secrets.
#
# SET IT UP (once, ~60 seconds)
#   1. Render dashboard -> your service -> Settings -> Deploy Hook
#      Copy the URL (https://api.render.com/deploy/srv-xxxxxxxx?key=yyyyyyyy)
#   2. GitHub -> this repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret
#         Name:   RENDER_DEPLOY_HOOK
#         Secret: the URL from step 1
#   3. Done. Every push to main (including merges) now deploys automatically,
#      and you can also run it by hand: Actions -> Deploy to Render -> Run.
#
# Without the secret the workflow exits green with a notice and does nothing,
# so it is safe to keep in the repo either way.
# ============================================================================
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice title=Render deploy skipped::RENDER_DEPLOY_HOOK is not set. Add it in Settings -> Secrets -> Actions to enable automatic deploys."
            exit 0
          fi
          code=$(curl -s -o /tmp/render.out -w '%{http_code}' -X POST "$HOOK")
          echo "render responded: $code"
          cat /tmp/render.out || true
          # 200/201/202 are all accepted by Render for a queued deploy
          case "$code" in
            2*) echo "Deploy queued." ;;
            *) echo "::error title=Render deploy failed::Hook returned HTTP $code"; exit 1 ;;
          esac
