# Render.com blueprint — FREE tier deployment (no credit card, no persistent disk).
#
# Data persistence: free instances lose the filesystem on every deploy. The app can
# sync data/db.json to a PRIVATE GitHub repository (BACKUP_REPO + BACKUP_TOKEN).
# KYC/deposit uploads are excluded from GitHub sync by default; configure private,
# durable object storage before accepting production identity documents.
#
# Set these env vars when prompted: ADMIN_EMAIL, ADMIN_PASSWORD, JWT_SECRET,
# BACKUP_REPO, BACKUP_TOKEN.
#
# Later upgrade to always-on + persistent disk: change plan to `starter` and
# uncomment the disk block (the GitHub sync then acts as a safety net).
services:
  - type: web
    name: blockchain-bullhorn
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BACKUP_REPO
        sync: false
      - key: BACKUP_TOKEN
        sync: false
      - key: BACKUP_UPLOADS_ENABLED
        value: "false"
    # ---- paid upgrade (always-on + persistent disk) ----
    # plan: starter
    # disk:
    #   name: bb-data
    #   mountPath: /app/data
    #   sizeGB: 1
