# Render.com blueprint — FREE tier deployment (no credit card, no persistent disk).
#
# Data persistence: free instances lose the filesystem on every deploy, so the
# app syncs data/db.json + data/uploads/ to a PRIVATE GitHub repository
# (BACKUP_REPO + BACKUP_TOKEN) and restores them automatically on boot.
#
# Set these env vars when prompted: ADMIN_EMAIL, ADMIN_PASSWORD, JWT_SECRET,
# BACKUP_REPO, BACKUP_TOKEN.
#
# Later upgrade to always-on + persistent disk: change plan to `starter` and
# uncomment the disk block (the GitHub sync then acts as a safety net).
services:
  - type: web
    name: blockchain-bullhorn
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BACKUP_REPO
        sync: false
      - key: BACKUP_TOKEN
        sync: false
      # wallet addresses (re-applied on every boot; the free tier wipes data/)
      - key: DEPOSIT_ADDRESSES
        sync: false
      - key: PRODUCT_PAYMENT_ADDRESSES
        sync: false
      # ---- email ----
      # The free tier blocks SMTP ports (25/465/587), so prefer an HTTP transport:
      # EMAIL_TRANSPORT=sendgrid + SENDGRID_API_KEY, or EMAIL_TRANSPORT=relay +
      # MAIL_RELAY_URL/MAIL_RELAY_SECRET. SMTP_* below only works on a paid instance.
      - key: SITE_URL
        sync: false
      - key: EMAIL_TRANSPORT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
    # ---- paid upgrade (always-on + persistent disk) ----
    # plan: starter
    # disk:
    #   name: bb-data
    #   mountPath: /app/data
    #   sizeGB: 1
