<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="website" property="og:type"/>
<meta content="Blockchain Bullhorn" property="og:site_name"/>
<meta content="Set New Password — The Blockchain Bullhorn" property="og:title"/>
<meta content="Elite crypto education, live markets, demo &amp; live trading on crypto, stocks, and real-world assets. Grab the Bull by the Horns." property="og:description"/>
<meta content="https://blockchainbullhorn.onrender.com/assets/img/brand/og-image.jpg" property="og:image"/>
<meta content="https://blockchainbullhorn.onrender.com/reset-password" property="og:url"/>
<meta content="summary_large_image" name="twitter:card"/>
<meta content="https://blockchainbullhorn.onrender.com/assets/img/brand/og-image.jpg" name="twitter:image"/>
<title>Set New Password — The Blockchain Bullhorn</title>
<link href="/assets/img/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="/manifest.webmanifest" rel="manifest"/>
<link href="/assets/css/fonts.css" rel="stylesheet"/>
<link href="/assets/css/fontawesome.css?v=2" rel="stylesheet"/>
<link href="/assets/css/main.css?v=16" rel="stylesheet"/>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="ticker-bar"><div class="ticker-track" id="tickerTrack"></div></div>
<section class="section" style="padding-top:64px">
<div class="container" style="max-width:480px">
<div class="card" style="padding:38px">
<div class="text-center mb-2">
<a href="/" title="Back to homepage"><img alt="Blockchain Bullhorn logo" src="/assets/img/brand/logo.png" style="width:64px;height:64px;border-radius:16px;margin:0 auto 16px"/></a>
<h1 data-i18n="rpw.s1" style="font-size:26px">Set a New Password</h1>
<p class="muted small" data-i18n="rpw.s2">Choose a strong password you don't use anywhere else.</p>
</div>
<div class="alert alert-error" id="rpAlert"></div>
<div class="alert alert-success" id="rpOk"></div>
<form id="rpForm" novalidate="">
<div class="field">
<label data-i18n="rpw.s3" for="pw">New password</label>
<div class="pw-wrap">
<input class="input" id="pw" placeholder="Min. 8 characters" data-i18n-ph="rpw.pwPh" required="" type="password"/>
<button class="pw-eye" id="pwEye" type="button"><i class="fas fa-eye"></i></button>
</div>
</div>
<div class="field">
<label data-i18n="rpw.s4" for="pw2">Confirm new password</label>
<input class="input" id="pw2" placeholder="Repeat password" data-i18n-ph="rpw.pw2Ph" required="" type="password"/>
</div>
<button class="btn btn-primary btn-lg btn-block" id="rpBtn" type="submit"><i class="fas fa-check-double"></i><span data-i18n="rpw.s5">Update Password</span></button>
</form>
</div>
</div>
</section>
<footer class="site-footer" id="site-footer"></footer>
<script src="/assets/js/i18n-pages.js?v=22"></script>
  <script src="/assets/js/common.js?v=22"></script>
<script>
    document.addEventListener('bb:ready', () => {
      const token = new URLSearchParams(location.search).get('token') || '';
      $('#pwEye').addEventListener('click', () => {
        const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password';
        $('#pwEye').innerHTML = i.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
      });
      $('#rpForm').addEventListener('submit', async e => {
        e.preventDefault();
        const a = $('#rpAlert'), ok = $('#rpOk');
        a.classList.remove('show'); ok.classList.remove('show');
        const pw = $('#pw').value;
        if (pw !== $('#pw2').value) { a.textContent = 'Passwords do not match.'; a.classList.add('show'); return; }
        const btn = $('#rpBtn'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Updating…';
        const r = await BB.api('/api/auth/reset', { method: 'POST', body: { token, password: pw } });
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-double"></i> Update Password';
        if (r.ok) {
          ok.innerHTML = `${BB.esc(r.message)}<br><br><a class="btn btn-gold btn-block" href="/login"><i class="fas fa-right-to-bracket"></i> Go to Log In</a>`;
          ok.classList.add('show');
          $('#rpForm').style.display = 'none';
        } else { a.textContent = r.error; a.classList.add('show'); }
      });
    });
  </script>
</body>
</html>
