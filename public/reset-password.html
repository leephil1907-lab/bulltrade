<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password — The Blockchain Bullhorn</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/fontawesome.css?v=2">
  <link rel="stylesheet" href="/assets/css/main.css?v=12">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="ticker-bar"><div class="ticker-track" id="tickerTrack"></div></div>

  <section class="section" style="padding-top:64px">
    <div class="container" style="max-width:480px">
      <div class="card" style="padding:38px">
        <div class="text-center mb-2">
          <img src="/assets/img/brand/logo.png" alt="" style="width:64px;height:64px;border-radius:16px;margin:0 auto 16px">
          <h1 style="font-size:26px">Set a New Password</h1>
          <p class="muted small">Choose a strong password you don't use anywhere else.</p>
        </div>
        <div class="alert alert-error" id="rpAlert"></div>
        <div class="alert alert-success" id="rpOk"></div>
        <form id="rpForm" novalidate>
          <div class="field">
            <label for="pw">New password</label>
            <div class="pw-wrap">
              <input class="input" type="password" id="pw" placeholder="Min. 8 characters" required>
              <button type="button" class="pw-eye" id="pwEye"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="field">
            <label for="pw2">Confirm new password</label>
            <input class="input" type="password" id="pw2" placeholder="Repeat password" required>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="rpBtn"><i class="fas fa-check-double"></i> Update Password</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="/assets/js/common.js?v=11"></script>
  <script>
    document.addEventListener('bb:ready', () => {
      const token = new URLSearchParams(location.search).get('token') || '';
      $('#pwEye').addEventListener('click', () => {
        const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password';
        $('#pwEye').innerHTML = i.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
      });
      $('#rpForm').addEventListener('submit', async e => {
        e.preventDefault();
        const a = $('#rpAlert'), ok = $('#rpOk');
        a.classList.remove('show'); ok.classList.remove('show');
        const pw = $('#pw').value;
        if (pw !== $('#pw2').value) { a.textContent = 'Passwords do not match.'; a.classList.add('show'); return; }
        const btn = $('#rpBtn'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Updating…';
        const r = await BB.api('/api/auth/reset', { method: 'POST', body: { token, password: pw } });
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-double"></i> Update Password';
        if (r.ok) {
          ok.innerHTML = `${BB.esc(r.message)}<br><br><a class="btn btn-gold btn-block" href="/login"><i class="fas fa-right-to-bracket"></i> Go to Log In</a>`;
          ok.classList.add('show');
          $('#rpForm').style.display = 'none';
        } else { a.textContent = r.error; a.classList.add('show'); }
      });
    });
  </script>
</body>
</html>
