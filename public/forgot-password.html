<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="website" property="og:type"/>
<meta content="Blockchain Bullhorn" property="og:site_name"/>
<meta content="Recover Password — The Blockchain Bullhorn" property="og:title"/>
<meta content="Elite crypto education, live markets, demo &amp; live trading on crypto, stocks, and real-world assets. Grab the Bull by the Horns." property="og:description"/>
<meta content="https://blockchainbullhorn.onrender.com/assets/img/brand/og-image.jpg" property="og:image"/>
<meta content="https://blockchainbullhorn.onrender.com/forgot-password" property="og:url"/>
<meta content="summary_large_image" name="twitter:card"/>
<meta content="https://blockchainbullhorn.onrender.com/assets/img/brand/og-image.jpg" name="twitter:image"/>
<title>Recover Password — The Blockchain Bullhorn</title>
<link href="/assets/img/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="/manifest.webmanifest" rel="manifest"/>
<link href="/assets/css/fonts.css" rel="stylesheet"/>
<link href="/assets/css/fontawesome.css?v=2" rel="stylesheet"/>
<link href="/assets/css/main.css?v=16" rel="stylesheet"/>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="ticker-bar"><div class="ticker-track" id="tickerTrack"></div></div>
<section class="section" style="padding-top:64px">
<div class="container" style="max-width:480px">
<div class="card" style="padding:38px">
<div class="text-center mb-2">
<a href="/" title="Back to homepage"><img alt="Blockchain Bullhorn logo" src="/assets/img/brand/logo.png" style="width:64px;height:64px;border-radius:16px;margin:0 auto 16px"/></a>
<h1 data-i18n="fpw.s1" style="font-size:26px">Recover Password</h1>
<p class="muted small" data-i18n="fpw.s2">Enter the email you used to purchase or register. We'll create a secure recovery link.</p>
</div>
<div class="alert alert-error" id="fpAlert"></div>
<div class="alert alert-success" id="fpOk"></div>
<form id="fpForm" novalidate="">
<div class="field">
<label data-i18n="log.s5" for="email">Email</label>
<input class="input" id="email" placeholder="you@example.com" data-i18n-ph="fpw.emailPh" required="" type="email"/>
</div>
<button class="btn btn-primary btn-lg btn-block" id="fpBtn" type="submit"><i class="fas fa-key"></i><span data-i18n="fpw.s3">Send Recovery Info</span></button>
</form>
<div class="text-center mt-2">
<a class="btn btn-ghost btn-sm" href="/login"><i class="fas fa-arrow-left"></i><span data-i18n="fpw.s4">Back to Log In</span></a>
</div>
<p class="muted small text-center mt-2" data-i18n-html="fpw.h5">Also check the <a href="/faq">FAQ</a> — most access questions are answered there.</p>
</div>
</div>
</section>
<footer class="site-footer" id="site-footer"></footer>
<script src="/assets/js/i18n-pages.js?v=22"></script>
  <script src="/assets/js/common.js?v=22"></script>
<script>
    document.addEventListener('bb:ready', () => {
      $('#fpForm').addEventListener('submit', async e => {
        e.preventDefault();
        $('#fpAlert').classList.remove('show'); $('#fpOk').classList.remove('show');
        const btn = $('#fpBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Working…';
        const r = await BB.api('/api/auth/forgot', { method: 'POST', body: { email: $('#email').value.trim() } });
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-key"></i> Send Recovery Info';
        if (r.ok) {
          const ok = $('#fpOk');
          if (r.resetUrl) {
            ok.innerHTML = `${BB.esc(r.message)}<br><br>
              <a class="btn btn-gold btn-block" href="${r.resetUrl}"><i class="fas fa-unlock"></i> Open My Recovery Link</a>
              <div class="muted small mt-1">This link is unique to your account and expires in 1 hour.</div>`;
          } else {
            ok.textContent = r.message;
          }
          ok.classList.add('show');
        } else {
          const a = $('#fpAlert'); a.textContent = r.error; a.classList.add('show');
        }
      });
    });
  </script>
</body>
</html>
