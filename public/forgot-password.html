<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Blockchain Bullhorn">
  <meta property="og:title" content="Recover Password — The Blockchain Bullhorn">
  <meta property="og:description" content="Elite crypto education, live markets, demo & live trading on crypto, stocks, and real-world assets. Grab the Bull by the Horns.">
  <meta property="og:image" content="https://blockchainbullhorn.onrender.com/assets/img/brand/og-image.jpg">
  <meta property="og:url" content="https://blockchainbullhorn.onrender.com/forgot-password">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://blockchainbullhorn.onrender.com/assets/img/brand/og-image.jpg">
  <title>Recover Password — The Blockchain Bullhorn</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/fontawesome.css?v=2">
  <link rel="stylesheet" href="/assets/css/main.css?v=16">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="ticker-bar"><div class="ticker-track" id="tickerTrack"></div></div>

  <section class="section" style="padding-top:64px">
    <div class="container" style="max-width:480px">
      <div class="card" style="padding:38px">
        <div class="text-center mb-2">
          <a href="/" title="Back to homepage"><img src="/assets/img/brand/logo.png" alt="Blockchain Bullhorn logo" style="width:64px;height:64px;border-radius:16px;margin:0 auto 16px"></a>
          <h1 style="font-size:26px">Recover Password</h1>
          <p class="muted small">Enter the email you used to purchase or register. We'll create a secure recovery link.</p>
        </div>
        <div class="alert alert-error" id="fpAlert"></div>
        <div class="alert alert-success" id="fpOk"></div>
        <form id="fpForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" placeholder="you@example.com" required>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="fpBtn"><i class="fas fa-key"></i> Send Recovery Info</button>
        </form>
        <div class="text-center mt-2">
          <a href="/login" class="btn btn-ghost btn-sm"><i class="fas fa-arrow-left"></i> Back to Log In</a>
        </div>
        <p class="muted small text-center mt-2">Also check the <a href="/faq">FAQ</a> — most access questions are answered there.</p>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="/assets/js/common.js?v=14"></script>
  <script>
    document.addEventListener('bb:ready', () => {
      $('#fpForm').addEventListener('submit', async e => {
        e.preventDefault();
        $('#fpAlert').classList.remove('show'); $('#fpOk').classList.remove('show');
        const btn = $('#fpBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Working…';
        const r = await BB.api('/api/auth/forgot', { method: 'POST', body: { email: $('#email').value.trim() } });
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-key"></i> Send Recovery Info';
        if (r.ok) {
          const ok = $('#fpOk');
          if (r.resetUrl) {
            ok.innerHTML = `${BB.esc(r.message)}<br><br>
              <a class="btn btn-gold btn-block" href="${r.resetUrl}"><i class="fas fa-unlock"></i> Open My Recovery Link</a>
              <div class="muted small mt-1">This link is unique to your account and expires in 1 hour.</div>`;
          } else {
            ok.textContent = r.message;
          }
          ok.classList.add('show');
        } else {
          const a = $('#fpAlert'); a.textContent = r.error; a.classList.add('show');
        }
      });
    });
  </script>
</body>
</html>
