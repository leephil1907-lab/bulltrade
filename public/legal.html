    };
    document.addEventListener('bb:ready', () => {
      const p = new URLSearchParams(location.search).get('p') || 'terms';
      const pol = POLICIES[p] || POLICIES.terms;
      $('#legalBody').innerHTML = `
        <h2 style="color:var(--gold)">${pol.title}</h2>
        ${pol.updated ? `<p class="muted small" style="font-family:var(--font-head)">Last updated: ${pol.updated}</p>` : ''}

      $$('#legalNav a').forEach(a => a.classList.toggle('active', a.dataset.p === p));
      $$('#legalNav a').forEach(a => a.addEventListener('click', e => {
        e.preventDefault();
        history.pushState(null, '', '/legal?p=' + a.dataset.p);
        $('#legalBody').innerHTML = `<h2 style="color:var(--gold)">${POLICIES[a.dataset.p].title}</h2>
          ${POLICIES[a.dataset.p].updated ? `<p class="muted small" style="font-family:var(--font-head)">Last updated: ${POLICIES[a.dataset.p].updated}</p>` : ''}
          ${POLICIES[a.dataset.p].html}`;
        $$('#legalNav a').forEach(x => x.classList.toggle('active', x === a));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }));
